[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qechybrid"
version = "0.1.0"
description = "GPU-accelerated hybrid QEC decoding pipeline (surface code + qLDPC BP+OSD)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/MIT-ccn.txt"]
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "pandas", "stim", "pymatching", "ldpc>=2.0", "torch",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: scientific error-count regression or broad quality smoke check",
  "quality_smoke: broad quality bands, not a statistical regression guarantee",
]
